app-id: org.jdownloader.JDownloader
default-branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: jd-wrapper

finish-args:
  - --socket=x11
  - --share=ipc
  - --filesystem=xdg-download
  - --filesystem=/run/media
  - --filesystem=/media
  - --share=network
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk/install.sh
      # Copy the 'jar' executable to the JRE bin directory
      - source /usr/lib/sdk/openjdk/enable.sh &&
        cp -ra $JAVA_HOME/bin/jar /app/jre/bin

  - name: jdownloader-build
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk/bin:/usr/lib/sdk/openjdk/ant/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk/jvm/openjdk
        ANT_HOME: /usr/lib/sdk/openjdk/ant
    sources:
      - type: svn
        url: svn://svn.appwork.org/utils
        revision: "4410"
        dest: AppWorkUtils
      - type: svn
        url: svn://svn.jdownloader.org/jdownloader/browser
        revision: "50639"
        dest: JDBrowser
      - type: svn
        url: svn://svn.jdownloader.org/jdownloader/trunk
        revision: "50639"
        dest: JDownloader
      - type: svn
        url: svn://svn.jdownloader.org/jdownloader/MyJDownloaderClient
        revision: "50639"
        dest: MyJDownloaderClient
    build-commands:
      - source /usr/lib/sdk/openjdk/enable.sh &&
        cd JDownloader &&
        cp build/newBuild/build_standalone.xml build.xml &&
        ant standalone
      - install -d /app/lib/jdownloader
      - cp -r JDownloader/standalone/dist/* /app/lib/jdownloader/

  - name: jdownloader
    buildsystem: simple
    build-commands:
      - set -e
      - install -D jd-wrapper.sh /app/bin/jd-wrapper
      - install -Dm644 -t /app/share/metainfo org.jdownloader.JDownloader.metainfo.xml
      - install -Dm644 -t /app/share/applications org.jdownloader.JDownloader.desktop
      - install -Dm644 -t /app/share/icons/hicolor/512x512/apps org.jdownloader.JDownloader.png
      # Allows backward compatibility
      - ln -srv /usr/bin/ffmpeg /app/bin/ffmpeg
      - ln -srv /usr/bin/ffprobe /app/bin/ffprobe
    sources:
      - type: file
        path: jd-wrapper.sh
      - type: file
        path: org.jdownloader.JDownloader.desktop
      - type: file
        path: org.jdownloader.JDownloader.png
      - type: file
        path: org.jdownloader.JDownloader.metainfo.xml
